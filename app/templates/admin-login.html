<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin Login</title>
    <link rel="icon" href="{{ url_for('static', filename='icons/favicon.svg') }}" type="image/x-icon">
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="min-h-screen bg-gradient-to-tr from-indigo-50 via-white to-indigo-50 flex flex-col">
    <!-- Header -->
    <header class="bg-gray-600 shadow-md w-full top-0 left-0 z-40">
        <div class="relative max-w-[95vw] mx-auto py-4 flex items-center justify-between">
            <!-- Logo (left or center depending on screen size) -->
            <div class="text-xl font-bold text-white sm:w-auto w-full text-center sm:text-left">
                <a href="/" class="inline-block">
                    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="StatPulse Logo" class="h-10 mx-auto sm:mx-0" />
                </a>
            </div>
        </div>
      </div>
    </header>

    <!-- Page layout container -->
    <main class="max-w-[90vw] mx-auto pt-4 px-4">
        <!-- page content here -->
        <h1 class="text-5xl font-bold underline mb-8 text-center">Admin Login</h1>
        <form method="post" class="max-w-sm mx-auto bg-white p-8 rounded-lg shadow-lg min-h-[350px]">
            <label class="block mb-2 font-semibold text-gray-700" for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              required
              class="w-full p-3 mb-6 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />

            <label class="block mb-2 font-semibold text-gray-700" for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              required
              class="w-full p-3 mb-6 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />

            {% if error %}
            <span class="block mb-4 p-4 font-semibold bg-red-400 border-3 border-red-700 rounded text-center">{{ error }}</span>
            {% endif %}


            <input
              type="submit"
              value="Login"
              class="w-full bg-indigo-600 text-white font-bold py-3 rounded hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-300 cursor-pointer transition"
            />

        </form>
    </main>
</body>
<footer>
    <!--script src="{{ url_for('static', filename='js/predict.js') }}"></script -->
</footer>
</html>
